name: Bug report
description: Something doesn't work as described
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Distro, desktop and laptop model
      placeholder: "Ubuntu 24.04, GNOME 46 Wayland, Lenovo T14"
    validations:
      required: true
  - type: textarea
    id: check
    attributes:
      label: Output of `five-finger-gestures --check`
      render: text
    validations:
      required: true
  - type: textarea
    id: debug
    attributes:
      label: Debug log (if it's about gestures)
      description: |
        Run `pkill -f five-finger-gestures; five-finger-gestures --debug`, do the gesture, press Ctrl+C and paste the output.
      render: text
