# five-finger-gestures config  (~/.config/five-finger-gestures.conf)
# Format:  <gesture> = <command>        Changes apply on the next gesture, no restart.
# Any command works. gesture-key presses a key combo, e.g. gesture-key super+a.
# Lines starting with # are ignored.

# --- 5 fingers: swipe up/down/left/right, tap, pinch in, pinch out ---
swipe up    = ~/.local/bin/gesture-key volumeup       # volume up
swipe down  = ~/.local/bin/gesture-key volumedown     # volume down
swipe left  = ~/.local/bin/gesture-key previoussong   # previous song
swipe right = ~/.local/bin/gesture-key nextsong       # next song
tap         = ~/.local/bin/gesture-key playpause      # play / pause
# pinch in  = ~/.local/bin/gesture-key super+d        # show desktop (GNOME: set the shortcut first)
# pinch out = ~/.local/bin/gesture-key super+a        # GNOME app grid

# --- 4 fingers: tap only (4-finger swipes stay with your desktop) ---
4-finger tap = ~/.local/bin/gesture-key print         # screenshot tool
# for an instant full-screen screenshot on GNOME instead: gesture-key shift+print

# More ideas:
# swipe up  = ~/.local/bin/gesture-key super+a        # GNOME app grid
# swipe right = x-terminal-emulator                   # open a terminal
# tap       = notify-send "five fingers!"
