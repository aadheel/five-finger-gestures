# five-finger-gestures config  (~/.config/five-finger-gestures.conf)
# Format:  <gesture or setting> = <value>     Changes apply on the next gesture.
# Check this file any time with:  five-finger-gestures --check

# ---------------------------------------------------------------- gestures
# swipe <dir>  fires once, when you lift your fingers
# slide <dir>  repeats every "slide step" while your fingers keep moving,
#              and moving back the other way fires the opposite slide
# Directions: up, down, left, right. All of these are 5-finger gestures
# except "4-finger tap" (4-finger swipes stay with your desktop).
#
# Actions:  key <combo>    press keys, e.g. key super+a  (names: --list-keys)
#           anything else  runs as a command, e.g. notify-send "hi"

slide up     = key volumeup         # volume up, step by step as you slide
slide down   = key volumedown       # volume down
swipe left   = key previoussong     # previous song
swipe right  = key nextsong         # next song
tap          = key playpause        # play / pause
4-finger tap = key print            # screenshot tool (shift+print: instant full screen)
# pinch in   = key super+d          # show desktop (GNOME: set that shortcut first)
# pinch out  = key super+a          # GNOME app grid

# More ideas:
# slide up   = key brightnessup     # screen brightness as a slider
# slide down = key brightnessdown
# slide up   = pactl set-sink-volume @DEFAULT_SINK@ +2%   # finer volume steps
# swipe up   = key super+a          # GNOME app grid
# swipe down = x-terminal-emulator  # open a terminal

# ---------------------------------------------------------------- settings
# Uncomment to change. Units: mm, s or ms, %.
# swipe distance = 6mm     # how far the fingers must move for a swipe
# slide step     = 7mm     # how far to move per repeat of a slide
# tap max move   = 3mm     # a tap moves less than this
# tap max time   = 0.35s   # a tap lifts within this time (or e.g. 300ms)
# pinch amount   = 30%     # how much the fingers must close or spread
